[project]
name = "auditgym"
version = "1.0.0"
description = "Reproducible RL environment for AI financial auditors (Genesis Hackathon FinTech 2026)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "msgspec==0.22.0",
    "tzdata==2026.6",
    "rich==15.0.0",
]

[project.optional-dependencies]
gym = ["gymnasium==1.4.0", "numpy==2.4.6"]

[dependency-groups]
test = ["pytest==9.2.0", "hypothesis==6.170.15", "pytest-timeout==2.4.0"]

[project.scripts]
auditgym = "auditgym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-q -p no:cacheprovider"

[tool.uv]
default-groups = ["test"]
